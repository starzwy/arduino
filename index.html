<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Servo-Motores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Servo-Motores</h1>
        
        <div class="connection-status">
            <span id="status">Desconectado</span>
            <button id="connectBtn">Conectar</button>
        </div>

        <div class="servo-controls">
            <!-- Servo 1 -->
            <div class="servo-card">
                <div class="servo-header">
                    <h2>Servo 1</h2>
                    <div class="led-container">
                        <div class="led" id="led1"></div>
                        <span class="led-label">LED 1</span>
                    </div>
                </div>
                
                <div class="servo-position">
                    <span>Posição: <span id="servo1Pos">90</span>°</span>
                </div>
                
                <div class="control-group">
                    <label>Ângulo: <span id="angle1Label">90</span>°</label>
                    <input type="range" id="servo1Slider" min="0" max="180" value="90">
                </div>
                
                <div class="button-group">
                    <button class="preset-btn" data-servo="1" data-angle="0">0°</button>
                    <button class="preset-btn" data-servo="1" data-angle="90">90°</button>
                    <button class="preset-btn" data-servo="1" data-angle="180">180°</button>
                </div>
            </div>

            <!-- Servo 2 -->
            <div class="servo-card">
                <div class="servo-header">
                    <h2>Servo 2</h2>
                    <div class="led-container">
                        <div class="led" id="led2"></div>
                        <span class="led-label">LED 2</span>
                    </div>
                </div>
                
                <div class="servo-position">
                    <span>Posição: <span id="servo2Pos">90</span>°</span>
                </div>
                
                <div class="control-group">
                    <label>Ângulo: <span id="angle2Label">90</span>°</label>
                    <input type="range" id="servo2Slider" min="0" max="180" value="90">
                </div>
                
                <div class="button-group">
                    <button class="preset-btn" data-servo="2" data-angle="0">0°</button>
                    <button class="preset-btn" data-servo="2" data-angle="90">90°</button>
                    <button class="preset-btn" data-servo="2" data-angle="180">180°</button>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <p>Última ação: <span id="lastAction">Nenhuma</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
